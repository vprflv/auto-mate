<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="fine" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" stitchTiles="stitch" seed="17"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="3" intercept="-1"/>
      <feFuncG type="linear" slope="3" intercept="-1"/>
      <feFuncB type="linear" slope="3" intercept="-1"/>
    </feComponentTransfer>
  </filter>
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".055 .09" numOctaves="3" stitchTiles="stitch" seed="8"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.4" intercept="-.7"/>
      <feFuncG type="linear" slope="2.4" intercept="-.7"/>
      <feFuncB type="linear" slope="2.4" intercept="-.7"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#fine)" opacity=".8"/>
  <rect width="256" height="256" filter="url(#paper)" opacity=".3"/>
</svg>
